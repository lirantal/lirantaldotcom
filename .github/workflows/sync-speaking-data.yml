# Keeps the /speaking pages fresh without any hosting-specific deploy hooks.
#
# Every 6 hours this compares README.json from lirantal/public-speaking with the committed
# snapshot (src/data/speaking.json). When the talk data changed, it commits the new snapshot;
# the push to main is what triggers the regular site deploy.
#
# It also pushes an empty commit when an event that was "upcoming" at the last deploy has
# since passed, because "upcoming" vs "past" is computed at build time.

name: Sync speaking data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-speaking-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Keep in sync with SPEAKING.dataURL in src/config.mjs
      SPEAKING_DATA_URL: https://raw.githubusercontent.com/lirantal/public-speaking/main/README.json
      SNAPSHOT: src/data/speaking.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download latest speaking data
        run: |
          curl -fsSL --retry 3 "$SPEAKING_DATA_URL" -o "$RUNNER_TEMP/README.json"
          jq -e '.items | type == "array" and length > 0' "$RUNNER_TEMP/README.json" > /dev/null

      - name: Commit when talk data changed or the schedule went stale
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Compare items only: generatedAt changes on every public-speaking build.
          if ! cmp -s <(jq -S .items "$RUNNER_TEMP/README.json") <(jq -S .items "$SNAPSHOT"); then
            cp "$RUNNER_TEMP/README.json" "$SNAPSHOT"
            git add "$SNAPSHOT"
            git commit -m 'chore(speaking): sync speaking data from lirantal/public-speaking'
            git push
            exit 0
          fi

          # An event stops being "upcoming" the day after its date. If that moment fell after the
          # latest commit on main (and so after the latest deploy), rebuild so it moves to the archive.
          last_commit=$(git log -1 --format=%ct)
          now=$(date +%s)
          passed=$(jq --argjson last "$last_commit" --argjson now "$now" \
            '[.items[].date | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601 + 86400 | select(. > $last and . <= $now)] | length' \
            "$SNAPSHOT")
          if [ "$passed" -gt 0 ]; then
            git commit --allow-empty -m 'chore(speaking): rebuild to refresh the upcoming schedule'
            git push
            exit 0
          fi

          echo 'Speaking data unchanged and schedule up to date.'
